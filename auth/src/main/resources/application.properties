spring.application.name=auth

spring.datasource.url=jdbc:postgresql://postgres:5432/${AUTH_DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update



jwt.private-key=classpath:certs/private.pem
jwt.public-key=classpath:certs/public.pem
jwt.access-token-minutes=15
jwt.refresh-token-days=7


spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

server.port=8081